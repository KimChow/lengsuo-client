[workspace]
resolver = "2"
members = [
    "crates/lengsuo-tls",
    "crates/ss-core",
    "crates/ss-client",
    "crates/lengsuo-vless",
    "crates/lengsuo-vmess",
    "crates/lengsuo-trojan",
    "crates/lengsuo-shadowsocks",
    "crates/lengsuo-ss2022",
    "crates/lengsuo-hysteria",
    "crates/lengsuo-wireguard",
    "crates/lengsuo-anytls",
    "crates/lengsuo-environment",
    "crates/lengsuo-tun",
    "crates/lengsuo-node",
    "crates/agent-core",
    "crates/agent-gateway",
    "crates/policy-engine",
    "crates/lengsuo-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Lengsuo project"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
thiserror = "2"
tracing = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha1 = "0.10"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
sha2 = "0.10"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
hmac = "0.12"
md-5 = "0.10"
hkdf = "0.12"
crc32fast = "1"
sha3 = "0.10"
aes = "0.8"
getrandom = "0.2"
crc = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tempfile = "3"

[profile.dev]
incremental = false
debug = 0
strip = "debuginfo"

[profile.release]

[profile.test]

[profile.dev.build-override]

[profile.release.build-override]

[profile.test.build-override]
