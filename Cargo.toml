[workspace]
resolver = "2"
members = [
    "crates/lengsuo-tls",
    "crates/ss-core",
    "crates/ss-client",
    "crates/lengsuo-vless",
    "crates/lengsuo-vmess",
    "crates/lengsuo-trojan",
    "crates/lengsuo-shadowsocks",
    "crates/lengsuo-ss2022",
    "crates/lengsuo-hysteria",
    "crates/lengsuo-wireguard",
    "crates/lengsuo-anytls",
    "crates/lengsuo-environment",
    "crates/lengsuo-tun",
    "crates/lengsuo-node",
    "crates/lengsuo-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Lengsuo project"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
thiserror = "2"
tracing = "0.1"
aes-gcm = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hkdf = "0.12"
crc32fast = "1"
crc = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = false
debug = 0
strip = "debuginfo"

[profile.release]
debug = 0
strip = "debuginfo"

[profile.test]
debug = 0
strip = "debuginfo"
incremental = false

[profile.dev.build-override]
debug = 0

[profile.release.build-override]
debug = 0

[profile.test.build-override]
debug = 0
