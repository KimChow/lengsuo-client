[workspace]
resolver = "2"
members = [
    "crates/lengsuo-tls",
    "crates/ss-core",
    "crates/ss-client",
    "crates/lengsuo-vless",
    "crates/lengsuo-vmess",
    "crates/lengsuo-trojan",
    "crates/lengsuo-shadowsocks",
    "crates/lengsuo-ss2022",
    "crates/lengsuo-hysteria",
    "crates/lengsuo-wireguard",
    "crates/lengsuo-anytls",
    "crates/lengsuo-environment",
    "crates/lengsuo-tun",
    "crates/lengsuo-node",
    "crates/agent-memory",
    "crates/agent-core",
    "crates/agent-gateway",
    "crates/policy-engine",
    "crates/lengsuo-shell",
    "crates/credential-ref",
    "crates/agent-mcp",
    "crates/agent-tasks",
    "crates/agent-skills",
    "crates/agent-prompts",
    "crates/agent-tools",
    "crates/agent-tools-exec",
    "crates/agent-pty",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Lengsuo project"]

[workspace.dependencies]
tokio = { workspace = true, , features = ["io-util"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
debug = 0
strip = "debuginfo"
