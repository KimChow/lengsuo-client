name: reference-interop
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/run_reference_tests.py'
      - 'scripts/reference_fixtures.py'
      - 'scripts/reference_manifest.json'
      - 'scripts/run_baseline_tests.py'
      - 'scripts/baseline_manifest.json'
      - 'tools/reference/**'
      - '.github/workflows/reference-tests.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/run_reference_tests.py'
      - 'scripts/reference_fixtures.py'
      - 'scripts/reference_manifest.json'
      - 'scripts/run_baseline_tests.py'
      - 'scripts/baseline_manifest.json'
      - 'tools/reference/**'
      - '.github/workflows/reference-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # wireguard-go 参考适配器需要 Go 工具链；版本与官方检出 go.mod 要求一致。
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.1'
          cache: false
      - name: Environment and packet checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/lengsuo-reference/target
        run: cargo test -p lengsuo-environment -p lengsuo-tun --locked
      - name: Fixed reference tests
        run: python scripts/run_reference_tests.py --work-dir "${{ runner.temp }}/lengsuo-reference"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/lengsuo-reference/report.json
            ${{ runner.temp }}/lengsuo-reference/*.log
          if-no-files-found: ignore
          retention-days: 3
  # 基线轮（ALL-1 审计 P0-1）：八协议的 Rust↔Rust 互通用例是普通 `#[test]`，
  # `run_reference_tests.py` 只跑 `-- --ignored`（参考互通方向），因此这一向
  # 必须在独立 job 里单独跑，否则合流时不会被自动重跑。
  # 独立清单（scripts/baseline_manifest.json）、独立计数、独立退出码：
  # 实际 passed 必须等于清单登记值，否则 fail-closed 非 0 退出。
  baseline:
    runs-on: ubuntu-latest
    # 基线轮从 8 个 crate / 93 项扩到 25 个 crate / 1679 项，
    # CI 上要从零编译 25 个 crate 的 test target（CARGO_BUILD_JOBS=2，无 sccache），
    # 30 分钟不够用；给足余量避免因超时而误报门禁失败。
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baseline Rust-to-Rust interop
        run: python scripts/run_baseline_tests.py --work-dir "${{ runner.temp }}/lengsuo-baseline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline
          path: |
            ${{ runner.temp }}/lengsuo-baseline/report.json
            ${{ runner.temp }}/lengsuo-baseline/*.log
          if-no-files-found: ignore
          retention-days: 3
