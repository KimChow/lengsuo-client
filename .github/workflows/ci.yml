name: client-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - name: File length
        run: python3 scripts/check_line_limit.py
      - name: Docs are local-only
        run: python3 scripts/check_docs_not_tracked.py --allow-history
      - name: Lean build profiles
        run: python3 scripts/verify_build_profiles.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: timeout 120 cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked
  browser-components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - name: Browser component lints
        run: >-
          cargo clippy --locked --all-targets
          -p lengsuo-browser-profile -p lengsuo-browser-signature
          -p lengsuo-browser-package -p lengsuo-browser-lifecycle
          -p lengsuo-browser-installer -p lengsuo-browser-state
          -- -D warnings
      - name: Browser component tests
        run: >-
          cargo test --locked
          -p lengsuo-browser-profile -p lengsuo-browser-signature
          -p lengsuo-browser-package -p lengsuo-browser-lifecycle
          -p lengsuo-browser-installer -p lengsuo-browser-state
